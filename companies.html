<!-- ── Add / Edit modal ───────────────────────────────────── -->
<div class="modal-overlay hidden" id="modal">

    <div class="modal-header">

      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Company Name</label>
        <input type="text" class="form-input" id="f-name"
               placeholder="e.g. Shopify">
      </div>
      <div class="form-group">
        <label class="form-label">Role Title</label>
        <input type="text" class="form-input" id="f-role"
               placeholder="e.g. Senior Product Manager">

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        <div class="form-group" style="margin-bottom:0">
          <label class="form-label">Date Applied</label>
          <input type="date" class="form-input" id="f-date">
        </div>
        <div class="form-group" style="margin-bottom:0">
          <label class="form-label">Current Stage</label>
          <select class="form-select" id="f-stage">
            <option>Applied</option>
            <option>Phone Screen</option>
            <option>Technical</option>
            <option>Onsite</option>
            <option>Offer</option>

        <label class="form-label">Notes</label>
        <textarea class="form-textarea" id="f-notes" rows="5"

    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>

      <button class="modal-close" onclick="closeNotes()">×</button>
    </div>

        <div class="rte-toolbar">
          <button type="button" class="rte-btn" onmousedown="event.preventDefault()" onclick="fmt('bold')" title="Bold"><strong>B</strong></button>
          <button type="button" class="rte-btn" onmousedown="event.preventDefault()" onclick="fmt('italic')" title="Italic" style="font-style:italic">I</button>
          <button type="button" class="rte-btn" onmousedown="event.preventDefault()" onclick="fmt('underline')" title="Underline" style="text-decoration:underline">U</button>
          <span class="rte-sep"></span>
          <select class="rte-size" onchange="fmtSize(this)" title="Font size">
            <option value="" disabled selected>Size</option>
            <option value="2">Small</option>
            <option value="3">Normal</option>
            <option value="4">Large</option>
            <option value="6">Heading</option>
          </select>
          <span class="rte-sep"></span>

<!-- ── Toast ──────────────────────────────────────────────── -->
<div class="toast hidden" id="toast"></div>

<script>
/* ── Data helpers ── */
const get = k => JSON.parse(localStorage.getItem(k) || '[]');
const set = (k, v) => { localStorage.setItem(k, JSON.stringify(v)); if (typeof autoSave === 'function') autoSave(); };
const uid = () => 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);

const STAGE_ORDER   = ['Applied','Phone Screen','Technical','Onsite','Offer','Rejected'];
const ACTIVE_STAGES = new Set(['Phone Screen','Technical','Onsite','Offer']);

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function stageBadge(s) {
  return `<span class="stage-badge stage-${esc(s.replace(/ /g,'-'))}">${esc(s)}</span>`;
}

function fmtDate(d) {
  if (!d) return '—';
  return new Date(d + 'T12:00:00').toLocaleDateString('en-CA', { month:'short', day:'numeric', year:'numeric' });
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.remove('hidden');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.add('hidden'), 2600);
}

/* ── Render ── */
function renderList() {
  const companies  = get('ip_companies');
  const search     = document.getElementById('search').value.toLowerCase();
  const stageFilter = document.getElementById('filter-stage').value;

  let filtered = companies.filter(c => {
    const hay = (c.name + ' ' + c.role + ' ' + (c.notes || '')).toLowerCase();
    return (!search      || hay.includes(search))
        && (!stageFilter || c.stage === stageFilter);
  });

  const countEl = document.getElementById('filter-count');
  countEl.textContent = filtered.length !== companies.length
    ? `${filtered.length} of ${companies.length}`
    : `${companies.length} compan${companies.length !== 1 ? 'ies' : 'y'}`;

  const el = document.getElementById('company-list');

  if (filtered.length === 0) {
    el.innerHTML = `<div class="empty-state">
      <span class="empty-icon">○</span>
      <p>${companies.length === 0
        ? 'No companies yet. Click "Add Company" to get started.'
        : 'No companies match your filters.'}</p>
    </div>`;
    return;
  }

  /* sort by stage order, then alphabetically within stage */
  filtered.sort((a, b) => {
    const diff = STAGE_ORDER.indexOf(a.stage) - STAGE_ORDER.indexOf(b.stage);
    return diff !== 0 ? diff : a.name.localeCompare(b.name);
  });

  const interviewing = filtered.filter(c => ACTIVE_STAGES.has(c.stage));
  const rest         = filtered.filter(c => !ACTIVE_STAGES.has(c.stage));

  let html = '';

  if (interviewing.length > 0) {
    html += `<div class="section-label" style="margin-bottom:18px">Actively Interviewing</div>
             <div class="companies-grid" style="margin-bottom:44px">${interviewing.map(c => companyCard(c)).join('')}</div>`;
  }

  if (rest.length > 0) {
    html += `${interviewing.length > 0 ? '<div class="section-label" style="margin-bottom:18px">All Applications</div>' : ''}
             <div class="companies-grid">${rest.map(c => companyCard(c)).join('')}</div>`;
  }

  el.innerHTML = html;
}

function pipelineBar(stage) {
  const idx = STAGE_ORDER.indexOf(stage);
  const colours = [
    'var(--s-applied-fg)', 'var(--s-phone-fg)', 'var(--s-tech-fg)',
    'var(--s-onsite-fg)',  'var(--s-offer-fg)'
  ];
  const steps = STAGE_ORDER.slice(0, 5).map((_, i) => {
    const active = stage !== 'Rejected' && i <= idx;
    return `<div class="pipeline-step" style="${active ? 'background:'+colours[i] : ''}"></div>`;
  }).join('');
  return `<div class="pipeline-bar">${steps}</div>`;
}

function companyCard(c) {
  return `
    <div class="company-card" id="card-${c.id}">
      <div class="company-card-top">
        <div>
          <button class="company-name-btn" onclick="openDrawer('${c.id}')">${esc(c.name)}</button>
          <div class="company-role">${esc(c.role)}</div>
        </div>
        ${stageBadge(c.stage)}
      </div>
      ${pipelineBar(c.stage)}
      <div class="company-applied">Applied ${fmtDate(c.appliedDate)}</div>
      <div class="company-footer">
        <div style="display:flex;gap:6px">
          <button class="btn btn-secondary btn-sm" onclick="openModal('${c.id}')">Edit</button>
          ${(c.notes || (c.noteTabs && c.noteTabs.length > 0)) ? `<button class="btn btn-secondary btn-sm" onclick="openNotes('${c.id}')">Notes</button>` : ''}
          <div class="kebab-wrap">
            <button class="kebab-btn" onclick="toggleKebab(event,'${c.id}')" aria-label="Edit options"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg></button>
            <div class="kebab-menu" id="kebab-${c.id}">
              <button class="kebab-menu-item danger" onclick="deleteC('${c.id}')">Delete</button>
            </div>
          </div>
        </div>
        <select class="stage-select" onchange="setStage('${c.id}', this.value)">
          ${STAGE_ORDER.map(s => `<option value="${s}"${c.stage === s ? ' selected' : ''}>${s}</option>`).join('')}
        </select>
      </div>
    </div>`;
}

/* ── Modal ── */
let editId = null;

function openModal(id = null) {
  editId = id;
  document.getElementById('modal-title').textContent = id ? 'Edit Company' : 'Add Company';

  if (id) {
    const c = get('ip_companies').find(x => x.id === id);
    if (c) {
      document.getElementById('f-name').value  = c.name;
      document.getElementById('f-role').value  = c.role;
      document.getElementById('f-date').value  = c.appliedDate || '';
      document.getElementById('f-stage').value = c.stage;
      document.getElementById('f-notes').value = c.notes || '';
    }
  } else {
    document.getElementById('f-name').value  = '';
    document.getElementById('f-role').value  = '';
    document.getElementById('f-date').value  = new Date().toISOString().split('T')[0];
    document.getElementById('f-stage').value = 'Applied';
    document.getElementById('f-notes').value = '';
  }

  document.getElementById('modal').classList.remove('hidden');
  setTimeout(() => document.getElementById('f-name').focus(), 60);
}

function closeModal() {
  document.getElementById('modal').classList.add('hidden');
  editId = null;
}

function saveCompany() {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { alert('Please enter a company name.'); return; }

  const companies = get('ip_companies');

  if (editId) {
    const idx = companies.findIndex(c => c.id === editId);
    if (idx > -1) {
      companies[idx] = {
        ...companies[idx],
        name,
        role:        document.getElementById('f-role').value.trim(),
        appliedDate: document.getElementById('f-date').value,
        stage:       document.getElementById('f-stage').value,
        notes:       document.getElementById('f-notes').value.trim(),
      };
    }
  } else {
    companies.push({
      id:          uid(),
      name,
      role:        document.getElementById('f-role').value.trim(),
      appliedDate: document.getElementById('f-date').value,
      stage:       document.getElementById('f-stage').value,
      notes:       document.getElementById('f-notes').value.trim(),
      dateAdded:   new Date().toISOString().split('T')[0],
    });
  }

  set('ip_companies', companies);
  closeModal();
  renderList();
  toast(editId ? 'Company updated.' : 'Company saved.');
}

/* ── Set stage ── */
function setStage(id, stage) {
  const companies = get('ip_companies');
  const c = companies.find(x => x.id === id);
  if (!c || c.stage === stage) return;
  c.stage = stage;
  set('ip_companies', companies);
  renderList();
  toast(`${c.name} → ${stage}.`);
}

function deleteC(id) {
  const c = get('ip_companies').find(x => x.id === id);
  if (!c) return;
  if (!confirm(`Delete ${c.name}? This cannot be undone.`)) return;
  set('ip_companies', get('ip_companies').filter(x => x.id !== id));
  renderList();
  toast('Company deleted.');
}

/* ── Close modal on backdrop click ── */
document.getElementById('modal').addEventListener('click', e => {
  if (e.target === document.getElementById('modal')) closeModal();
});

/* ── Notes modal ── */
let notesId = null;
let _noteTabs = [];
let _activeTabId = null;
let _rteRange = null;
let _notesAutoSaveTimer = null;

/* RTE helpers */
function saveRteRange() {
  const sel = window.getSelection();
  _rteRange = sel.rangeCount > 0 ? sel.getRangeAt(0).cloneRange() : null;
}

function restoreRteRange() {
  const el = document.getElementById('notes-modal-body');
  el.focus();
  if (!_rteRange) return;
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(_rteRange);
}

function fmt(cmd) { restoreRteRange(); document.execCommand(cmd, false, null); }

function fmtSize(sel) {
  restoreRteRange();
  document.execCommand('fontSize', false, sel.value);
  sel.value = '';
}

function fmtColor(color) {
  restoreRteRange();
  document.execCommand('foreColor', false, color);
  document.getElementById('rte-color-swatch').style.background = color;
}

/* Tab helpers */
function setRteContent(content) {
  const el = document.getElementById('notes-modal-body');
  if (content && /<[a-z][^>]*>/i.test(content)) {
    el.innerHTML = content;
  } else {
    el.innerText = content || '';
  }
}

function captureCurrentTab() {
  const tab = _noteTabs.find(t => t.id === _activeTabId);
  if (tab) tab.content = document.getElementById('notes-modal-body').innerHTML;
}

function renderNoteTabs() {
  document.getElementById('notes-tabs').innerHTML =
    _noteTabs.map(t => `
      <button class="notes-tab${t.id === _activeTabId ? ' active' : ''}"
              onclick="switchNoteTab('${t.id}')"
              ondblclick="renameNoteTab(event,'${t.id}')">
        ${esc(t.label)}
        ${_noteTabs.length > 1
          ? `<span class="notes-tab-close" onmousedown="event.preventDefault()" onclick="deleteNoteTab(event,'${t.id}')">×</span>`
          : ''}
      </button>`).join('') +
    `<button class="notes-tab-add" onmousedown="event.preventDefault()" onclick="addNoteTab()" title="New tab">+</button>`;
}

function switchNoteTab(id) {
  if (id === _activeTabId) return;
  captureCurrentTab();
  _activeTabId = id;
  const tab = _noteTabs.find(t => t.id === id);
  setRteContent(tab ? tab.content : '');
  renderNoteTabs();
  persistNoteTabs();
  setTimeout(() => document.getElementById('notes-modal-body').focus(), 30);
}

function addNoteTab() {
  const label = prompt('Tab name:', `Tab ${_noteTabs.length + 1}`);
  if (!label || !label.trim()) return;
  captureCurrentTab();
  const newId = 'tab_' + Date.now();
  _noteTabs.push({ id: newId, label: label.trim(), content: '' });
  _activeTabId = newId;
  document.getElementById('notes-modal-body').innerHTML = '';
  renderNoteTabs();
  persistNoteTabs();
  setTimeout(() => document.getElementById('notes-modal-body').focus(), 30);
}

function deleteNoteTab(event, id) {
  event.stopPropagation();
  if (_noteTabs.length <= 1) return;
  const tab = _noteTabs.find(t => t.id === id);
  if (!confirm(`Delete tab "${tab ? tab.label : ''}"?`)) return;
  const idx = _noteTabs.findIndex(t => t.id === id);
  _noteTabs.splice(idx, 1);
  if (_activeTabId === id) {
    _activeTabId = _noteTabs[Math.min(idx, _noteTabs.length - 1)].id;
    const next = _noteTabs.find(t => t.id === _activeTabId);
    setRteContent(next ? next.content : '');
  }
  renderNoteTabs();
  persistNoteTabs();
}

function renameNoteTab(event, id) {
  event.stopPropagation();
  const tab = _noteTabs.find(t => t.id === id);
  if (!tab) return;
  const newLabel = prompt('Rename tab:', tab.label);
  if (newLabel && newLabel.trim()) {
    tab.label = newLabel.trim();
    renderNoteTabs();
    persistNoteTabs();
  }
}

function persistNoteTabs() {
  if (!notesId) return;
  clearTimeout(_notesAutoSaveTimer);
  captureCurrentTab();
  const companies = get('ip_companies');
  const c = companies.find(x => x.id === notesId);
  if (!c) return;
  c.noteTabs  = JSON.parse(JSON.stringify(_noteTabs));
  c.activeTab = _activeTabId;
  set('ip_companies', companies);
}

function scheduleNotesAutoSave() {
  clearTimeout(_notesAutoSaveTimer);
  _notesAutoSaveTimer = setTimeout(persistNoteTabs, 1500);
}

function openNotes(id) {
  const c = get('ip_companies').find(x => x.id === id);
  if (!c) return;
  notesId  = id;
  _rteRange = null;
  document.getElementById('notes-modal-title').textContent = c.name + ' — Interview Notes';

  if (c.noteTabs && c.noteTabs.length > 0) {
    _noteTabs    = JSON.parse(JSON.stringify(c.noteTabs));
    _activeTabId = (c.activeTab && _noteTabs.find(t => t.id === c.activeTab))
      ? c.activeTab : _noteTabs[0].id;
  } else {
    const defaultId = 'tab_' + Date.now();
    _noteTabs    = [{ id: defaultId, label: 'Notes', content: c.notes || '' }];
    _activeTabId = defaultId;
  }

  const activeTab = _noteTabs.find(t => t.id === _activeTabId);
  setRteContent(activeTab ? activeTab.content : '');
  renderNoteTabs();
  document.getElementById('notes-modal').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  setTimeout(() => document.getElementById('notes-modal-body').focus(), 60);
}

function saveNotes() {
  closeNotes();
  toast('Notes saved.');
}

function closeNotes() {
  clearTimeout(_notesAutoSaveTimer);
  persistNoteTabs();
  document.getElementById('notes-modal').classList.add('hidden');
  document.body.style.overflow = '';
  notesId = null;
  _noteTabs = [];
  _activeTabId = null;
  _rteRange = null;
  renderList();
}

document.getElementById('notes-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('notes-modal')) closeNotes();
});

let _fh = null;

const _idb = (() => {
  let _db;
  const open = () => new Promise((res, rej) => {
    if (_db) return res(_db);
    const req = indexedDB.open('ip_sync', 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore('handles');
    req.onsuccess = e => { _db = e.target.result; res(_db); };
    req.onerror = () => rej(req.error);
  });
  return {
    get: async k => { const d = await open(); return new Promise((res, rej) => { const t = d.transaction('handles','readonly'); const r = t.objectStore('handles').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
    put: async (k, v) => { const d = await open(); return new Promise((res, rej) => { const t = d.transaction('handles','readwrite'); const r = t.objectStore('handles').put(v, k); r.onsuccess = () => res(); r.onerror = () => rej(r.error); }); },
  };
})();

async function autoSave() {
  if (!_fh) return;
  try {
    const data = {
      ip_companies: JSON.parse(localStorage.getItem('ip_companies') || '[]'),
      ip_questions: JSON.parse(localStorage.getItem('ip_questions') || '[]'),
      savedAt: new Date().toISOString(),
    };
    const w = await _fh.createWritable();
    await w.write(JSON.stringify(data, null, 2));
    await w.close();
  } catch {
    _fh = null;
    setSyncLabel('Link file');
  }
}

function setSyncLabel(text) {
  const el = document.getElementById('btn-link-file');
  if (el) el.querySelector('span').textContent = text;
}

async function linkFile() {
  if (!window.showSaveFilePicker) {
    alert('Auto-save requires Chrome or Edge. Use "Export backup" to save manually.');
    return;
  }
  try {
    const fh = await window.showSaveFilePicker({
      suggestedName: 'interview-prep.json',
      types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }],
    });
    _fh = fh;
    await _idb.put('fh', fh);
    setSyncLabel('✓ Linked');
    await autoSave();
    toast('File linked — changes will auto-save.');
  } catch {}
}

async function initFileSync() {
  if (!window.showSaveFilePicker) return;
  try {
    const fh = await _idb.get('fh');
    if (!fh) return;
    const perm = await fh.queryPermission({ mode: 'readwrite' });
    if (perm === 'granted') {
      _fh = fh; setSyncLabel('✓ Linked');
    } else if (perm === 'prompt') {
      const granted = await fh.requestPermission({ mode: 'readwrite' });
      if (granted === 'granted') { _fh = fh; setSyncLabel('✓ Linked'); }
    }
  } catch {}
}

function exportData() {
  const data = {
    ip_companies: JSON.parse(localStorage.getItem('ip_companies') || '[]'),
    ip_questions: JSON.parse(localStorage.getItem('ip_questions') || '[]'),
    exportedAt: new Date().toISOString().split('T')[0],
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `interview-prep-${data.exportedAt}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!data.ip_companies && !data.ip_questions) throw new Error('Unrecognised file.');
      if (data.ip_companies) localStorage.setItem('ip_companies', JSON.stringify(data.ip_companies));
      if (data.ip_questions) localStorage.setItem('ip_questions', JSON.stringify(data.ip_questions));
      location.reload();
    } catch {
      alert('Could not import: invalid or unrecognised file.');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

/* ── Init ── */
document.getElementById('sidebar-date').textContent =
  new Date().toLocaleDateString('en-CA', { weekday:'short', month:'short', day:'numeric', year:'numeric' });

seedIfEmpty();
patchCompanyNotes();
renderList();
initFileSync();

function openNav()  { document.getElementById('sidebar').classList.add('open'); document.getElementById('nav-overlay').classList.add('open'); }
function closeNav() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('nav-overlay').classList.remove('open'); }
</script>
