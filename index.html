<!-- ── Main ──────────────────────────────────────────────── -->
<main class="main">
  <header class="mobile-header">
    <div class="mobile-header-logo">
      <div class="mark"></div>
      Interview Prep
    </div>
    <button class="hamburger-btn" onclick="openNav()" aria-label="Open navigation">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
  </header>
  <header class="page-header">
    <div>
      <h2>Dashboard</h2>
      <p>Your interview prep at a glance.</p>
    </div>
    <div class="profile-btn-wrap">
      <button class="profile-header-btn" id="btn-profile" onclick="toggleProfile(event)">DL</button>
      <div class="profile-popover hidden" id="profile-popover">
        <div class="profile-popover-avatar">DL</div>
        <div class="profile-popover-rule"></div>
        <div>
          <div class="profile-popover-name">Deron Li</div>
          <div class="profile-popover-email">deron_li@hotmail.com</div>
        </div>
        <div class="profile-popover-since">Member since May 2026</div>
        <div class="profile-popover-rule"></div>
        <button class="profile-popover-logout" onclick="closeProfile()">Log out</button>
      </div>
    </div>
  </header>

  <div class="page-content">

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">Questions</span>
        <span class="stat-value" id="stat-q">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Companies</span>
        <span class="stat-value" id="stat-c">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Active Pipeline</span>
        <span class="stat-value" id="stat-active">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Offers</span>
        <span class="stat-value" id="stat-offers">0</span>
      </div>
    </div>

    <!-- Pipeline -->
    <div class="section-label" style="margin-top:0">Active Pipeline</div>
    <div id="pipeline-wrap" style="margin-bottom:44px"></div>

    <!-- Recent questions -->
    <div class="section-label">Recent Questions</div>
    <div id="questions-wrap"></div>

  </div>
</main>

<script>
  /* ── helpers ── */
  const get = k => JSON.parse(localStorage.getItem(k) || '[]');
  const set = (k, v) => { localStorage.setItem(k, JSON.stringify(v)); if (typeof autoSave === 'function') autoSave(); };
  const uid = () => 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
  const ACTIVE         = ['Applied','Phone Screen','Technical','Onsite'];
  const ACTIVE_STAGES  = new Set(['Phone Screen','Technical','Onsite','Offer']);
  const STAGE_ORDER    = ['Applied','Phone Screen','Technical','Onsite','Offer','Rejected'];

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
  }

  function stageBadge(s) {
    return `<span class="stage-badge stage-${esc(s.replace(/ /g,'-'))}">${esc(s)}</span>`;
  }

  function catBadge(c) {
    return `<span class="cat-badge cat-${esc(c.replace(/ /g,'-'))}">${esc(c)}</span>`;
  }

  function fmtDate(d) {
    if (!d) return '—';
    return new Date(d + 'T12:00:00').toLocaleDateString('en-CA', { month:'short', day:'numeric', year:'numeric' });
  }

  function toast(msg) {
    const el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.remove('hidden');
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.add('hidden'), 2600);
  }

  /* ── render ── */
  function render() {
    const questions = get('ip_questions');
    const companies = get('ip_companies');
    const active    = companies.filter(c => ACTIVE.includes(c.stage));
    const offers    = companies.filter(c => c.stage === 'Offer');

    document.getElementById('stat-q').textContent      = questions.length;
    document.getElementById('stat-c').textContent      = companies.length;
    document.getElementById('stat-active').textContent = active.length;
    document.getElementById('stat-offers').textContent = offers.length;

    /* pipeline */
    const pEl = document.getElementById('pipeline-wrap');
    const pItems = companies
      .filter(c => c.stage !== 'Rejected')
      .sort((a, b) => {
        const aActive = ACTIVE_STAGES.has(a.stage);
        const bActive = ACTIVE_STAGES.has(b.stage);
        if (aActive !== bActive) return aActive ? -1 : 1;
        return STAGE_ORDER.indexOf(a.stage) - STAGE_ORDER.indexOf(b.stage);
      });
    if (pItems.length === 0) {
      pEl.innerHTML = `<div class="empty-state">
        <span class="empty-icon">○</span>
        <p>No active applications yet.<br><a href="companies.html">Add a company →</a></p>
      </div>`;
    } else {
      pEl.innerHTML = `<div class="companies-grid">${pItems.map(c => companyCard(c)).join('')}</div>`;
    }

    /* recent questions */
    const qEl = document.getElementById('questions-wrap');
    const recent = [...questions].reverse().slice(0, 5);
    if (recent.length === 0) {
      qEl.innerHTML = `<div class="empty-state">
        <span class="empty-icon">○</span>
        <p>No questions yet.<br><a href="questions.html">Add a question →</a></p>
      </div>`;
    } else {
      qEl.innerHTML = recent.map(q => `
        <div class="card">
          <div class="card-header">
            <div class="card-question">${esc(q.text)}</div>
          </div>
          <div class="card-meta">
            ${catBadge(q.category)}
            ${(q.companies || []).map(co => `<span class="tag-company">${esc(co)}</span>`).join('')}
          </div>
        </div>
      `).join('');
    }
  }

  function companyCard(c) {
    const STAGES = ['Applied','Phone Screen','Technical','Onsite','Offer','Rejected'];
    const idx    = STAGES.indexOf(c.stage);
    const steps  = STAGES.slice(0,5).map((_, i) => {
      const done = i <= idx && c.stage !== 'Rejected';
      const colours = [
        'var(--s-applied-fg)', 'var(--s-phone-fg)', 'var(--s-tech-fg)',
        'var(--s-onsite-fg)', 'var(--s-offer-fg)'
      ];
      return `<div class="pipeline-step" style="${done ? 'background:'+colours[i] : ''}"></div>`;
    }).join('');

    return `
      <div class="company-card">
        <div class="company-card-top">
          <div>
            <div class="company-name">${esc(c.name)}</div>
            <div class="company-role">${esc(c.role)}</div>
          </div>
          ${stageBadge(c.stage)}
        </div>
        <div class="pipeline-bar">${steps}</div>
        <div class="company-applied">Applied ${fmtDate(c.appliedDate)}</div>
        ${c.notes ? `<div class="company-notes">${esc(c.notes)}</div>` : ''}
      </div>`;
  }

  /* ── File System sync ── */
  let _fh = null;

  const _idb = (() => {
    let _db;
    const open = () => new Promise((res, rej) => {
      if (_db) return res(_db);
      const req = indexedDB.open('ip_sync', 1);
      req.onupgradeneeded = e => e.target.result.createObjectStore('handles');
      req.onsuccess = e => { _db = e.target.result; res(_db); };
      req.onerror = () => rej(req.error);
    });
    return {
      get: async k => { const d = await open(); return new Promise((res, rej) => { const t = d.transaction('handles','readonly'); const r = t.objectStore('handles').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
      put: async (k, v) => { const d = await open(); return new Promise((res, rej) => { const t = d.transaction('handles','readwrite'); const r = t.objectStore('handles').put(v, k); r.onsuccess = () => res(); r.onerror = () => rej(r.error); }); },
    };
  })();

  async function autoSave() {
    if (!_fh) return;
    try {
      const data = {
        ip_companies: JSON.parse(localStorage.getItem('ip_companies') || '[]'),
        ip_questions: JSON.parse(localStorage.getItem('ip_questions') || '[]'),
        savedAt: new Date().toISOString(),
      };
      const w = await _fh.createWritable();
      await w.write(JSON.stringify(data, null, 2));
      await w.close();
    } catch {
      _fh = null;
      setSyncLabel('Link file');
    }
  }

  function setSyncLabel(text) {
    const el = document.getElementById('btn-link-file');
    if (el) el.querySelector('span').textContent = text;
  }

  async function linkFile() {
    if (!window.showSaveFilePicker) {
      alert('Auto-save requires Chrome or Edge. Use "Export backup" to save manually.');
      return;
    }
    try {
      const fh = await window.showSaveFilePicker({
        suggestedName: 'interview-prep.json',
        types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }],
      });
      _fh = fh;
      await _idb.put('fh', fh);
      setSyncLabel('✓ Linked');
      await autoSave();
      toast('File linked — changes will auto-save.');
    } catch {}
  }

  async function initFileSync() {
    if (!window.showSaveFilePicker) return;
    try {
      const fh = await _idb.get('fh');
      if (!fh) return;
      const perm = await fh.queryPermission({ mode: 'readwrite' });
      if (perm === 'granted') {
        _fh = fh; setSyncLabel('✓ Linked');
      } else if (perm === 'prompt') {
        const granted = await fh.requestPermission({ mode: 'readwrite' });
        if (granted === 'granted') { _fh = fh; setSyncLabel('✓ Linked'); }
      }
    } catch {}
  }

  function exportData() {
    const data = {
      ip_companies: JSON.parse(localStorage.getItem('ip_companies') || '[]'),
      ip_questions: JSON.parse(localStorage.getItem('ip_questions') || '[]'),
      exportedAt: new Date().toISOString().split('T')[0],
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `interview-prep-${data.exportedAt}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function importData(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!data.ip_companies && !data.ip_questions) throw new Error('Unrecognised file.');
        if (data.ip_companies) localStorage.setItem('ip_companies', JSON.stringify(data.ip_companies));
        if (data.ip_questions) localStorage.setItem('ip_questions', JSON.stringify(data.ip_questions));
        location.reload();
      } catch {
        alert('Could not import: invalid or unrecognised file.');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  }

  /* ── seed ── */
  function seedIfEmpty() {
    if (get('ip_companies').length > 0) return;
    const seed = [
      { name:'MaintainX',    role:'Staff Designer',            stage:'Applied',       notes:'' },
      { name:'Harvey',       role:'Senior Product Designer',   stage:'Applied',       notes:'' },
      { name:'Venn',         role:'Senior Product Designer',   stage:'Applied',       notes:'' },
      { name:'eBay',         role:'Product Designer III',      stage:'Applied',       notes:'' },
      { name:'Tim Hortons',  role:'Product Designer II',       stage:'Applied',       notes:'' },
      { name:'Priceline',    role:'Senior Product Designer',   stage:'Applied',       notes:'' },
      { name:'Okta',         role:'Senior Product Designer',   stage:'Phone Screen',  notes:'' },
      { name:'7shifts',      role:'Senior Product Designer',   stage:'Rejected',      notes:'Rejected at hiring manager phase.' },
      { name:'Affinity',     role:'Senior Product Designer',   stage:'Applied',       notes:'' },
      { name:'Affirm',       role:'Senior Product Designer',   stage:'Applied',       notes:'' },
      { name:'Proof',        role:'Senior Product Designer',   stage:'Applied',       notes:'' },
      { name:'Sun Life',     role:'Senior Product Designer',   stage:'Applied',       notes:'' },
      { name:'Hopper',       role:'Senior Product Designer',   stage:'Applied',       notes:'' },
      { name:'Super.com',    role:'Senior Product Designer',   stage:'Applied',       notes:'' },
      { name:'Ashby',        role:'Senior Product Designer',   stage:'Applied',       notes:'' },
      { name:'Top Hat',      role:'Lead Product Designer',     stage:'Applied',       notes:'' },
      { name:'EvenUp',       role:'Senior Product Designer',   stage:'Applied',       notes:'' },
      { name:'OpenTable',    role:'Senior Product Designer',   stage:'Applied',       notes:'' },
      { name:'Fellow',       role:'Senior Product Designer',   stage:'Applied',       notes:'' },
      { name:'Float',        role:'Senior Product Designer',   stage:'Rejected',      notes:'Rejected at hiring manager phase.' },
      { name:'Koho',         role:'Senior Product Designer',   stage:'Applied',       notes:'' },
      { name:'Relay',        role:'Senior Product Designer',   stage:'Applied',       notes:'' },
      { name:'Stripe',       role:'Senior Product Designer',   stage:'Applied',       notes:'' },
      { name:'CaptivateIQ',  role:'Senior Product Designer',   stage:'Applied',       notes:'' },
      { name:'eBay (Search)',role:'Senior Product Designer',   stage:'Applied',       notes:'' },
      { name:'RBC',          role:'Senior Product Designer',   stage:'Applied',       notes:'' },
    ].map(c => ({ ...c, id: uid(), appliedDate: '', dateAdded: new Date().toISOString().split('T')[0] }));
    set('ip_companies', seed);
  }

  function seedQuestionsIfEmpty() {
    if (get('ip_questions').length > 0) return;
    const today = new Date().toISOString().split('T')[0];
    const seed = [
      { text: 'Can you describe a time when you had to make a design decision that went against a business requirement? How did you handle it?', category: 'Behavioural', companies: [], response: '' },
      { text: 'Tell me about a project where you used data or research to pivot the product direction.', category: 'Behavioural', companies: [], response: '' },
      { text: 'How do you ensure your design work aligns with the overall company vision and quarterly goals?', category: 'Situational', companies: [], response: '' },
      { text: 'Describe a situation where you had a significant disagreement with a Product Manager or Engineering Lead. How was it resolved?', category: 'Behavioural', companies: [], response: '' },
      { text: 'Tell me about a time you mentored a junior designer or influenced a peer. What was the outcome?', category: 'Leadership', companies: [], response: '' },
      { text: 'How do you think about Information Architecture and simplifying complex workflows?', category: 'Technical', companies: [], response: '' },
      { text: 'How do you handle a situation where a stakeholder gives you subjective feedback that you believe will hurt the user experience?', category: 'Situational', companies: [], response: '' },
    ].map(q => ({ ...q, id: uid(), dateAdded: today }));
    set('ip_questions', seed);
  }

  /* ── init ── */
  document.getElementById('sidebar-date').textContent =
    new Date().toLocaleDateString('en-CA', { weekday:'short', month:'short', day:'numeric', year:'numeric' });

  seedIfEmpty();
  seedQuestionsIfEmpty();
  render();
  initFileSync();

  function openNav()  { document.getElementById('sidebar').classList.add('open'); document.getElementById('nav-overlay').classList.add('open'); }
  function closeNav() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('nav-overlay').classList.remove('open'); }

  function toggleProfile(e) {
    e.stopPropagation();
    const popover = document.getElementById('profile-popover');
    popover.classList.toggle('hidden');
  }

  function closeProfile() {
    document.getElementById('profile-popover').classList.add('hidden');
  }

  document.addEventListener('click', function(e) {
    const popover = document.getElementById('profile-popover');
    const btn     = document.getElementById('btn-profile');
    if (!popover.classList.contains('hidden') &&
        !popover.contains(e.target) &&
        !btn.contains(e.target)) {
      closeProfile();
    }
  });
</script>

<div class="toast hidden" id="toast"></div>
</body>
</html>
